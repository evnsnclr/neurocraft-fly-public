<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">NeuroCraft Fly control path</title>
  <desc id="d">A signal pulse travels from a Minecraft event through an engineered encoder into the retained MaleCNS dynamics, to labeled readouts that select a scripted body program, and back to the authoritative world as a bounded transition; a read-only HUD taps the dynamics and the readouts. Every arrow is a declared modeling or engineering choice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c2e"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2740"/><stop offset="1" stop-color="#15203a"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { font-size: 17px; font-weight: 700; fill: #f8fafc; }
      .s { font-size: 12.5px; fill: #cbd5e1; }
      .m { font-size: 12px; font-style: italic; fill: #94a3b8; }
      .l { font-size: 12.5px; fill: #94a3b8; }
      .hud { font-size: 12.5px; fill: #cbd5e1; }
      .ev { font-size: 11px; font-weight: 600; fill: #f59e0b; letter-spacing: 0.4px; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#1e293b"/>

  <path d="M 236 180.0 L 266 180.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 476 180.0 L 506 180.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 716 180.0 L 746 180.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 956 180.0 L 986 180.0" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1092.0 244 L 1092.0 290 L 132.0 290 L 132.0 248" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text class="t l" x="600.0" y="314" text-anchor="middle">the server applies the bounded command as an authoritative world transition; the network selects a program and does not generate its trajectory</text>
  <rect x="300" y="24" width="760" height="40" rx="10" fill="#0f172a" stroke="#475569" stroke-dasharray="6 4"/>
  <text class="t hud" x="680" y="49" text-anchor="middle">Compact HUD, read-only: condition · control authority · model samples vs applied commands</text>
  <path d="M 612.0 116 L 612.0 66" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <circle r="3" fill="#38bdf8" opacity="0"><animateMotion dur="2.5s" begin="0.6s" repeatCount="indefinite" path="M 612.0 114 L 612.0 70"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
  <path d="M 852.0 116 L 852.0 66" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <circle r="3" fill="#38bdf8" opacity="0"><animateMotion dur="2.5s" begin="1.8s" repeatCount="indefinite" path="M 852.0 114 L 852.0 70"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="2.5s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#f59e0b" filter="url(#glow)"><animateMotion dur="10.0s" repeatCount="indefinite" path="M 132.0 180.0 L 1092.0 180.0 L 1092.0 290 L 132.0 290 Z"/></circle>
  <circle r="11" fill="#f59e0b" opacity="0.25"><animateMotion dur="10.0s" repeatCount="indefinite" path="M 132.0 180.0 L 1092.0 180.0 L 1092.0 290 L 132.0 290 Z"/></circle>
  <rect x="30" y="118" width="204" height="124" rx="12" fill="url(#box)" stroke="#334155" stroke-width="2"><animate attributeName="stroke" values="#f59e0b;#f59e0b;#334155;#334155;#f59e0b" keyTimes="0;0.0477;0.0777;0.9400;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <text class="t h" x="132.0" y="148" text-anchor="middle">Minecraft event</text>
  <text class="t s" x="132.0" y="174" text-anchor="middle">approach · contact · brush</text>
  <text class="t s" x="132.0" y="193" text-anchor="middle">attack attempt · food · light · mob</text>
  <text class="t m" x="132.0" y="222" text-anchor="middle">authoritative server, typed events</text>
  <rect x="270" y="118" width="204" height="124" rx="12" fill="url(#box)" stroke="#334155" stroke-width="2"><animate attributeName="stroke" values="#334155;#334155;#f59e0b;#f59e0b;#334155;#334155" keyTimes="0;0.0495;0.0645;0.1598;0.1898;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <text class="t h" x="372.0" y="148" text-anchor="middle">Engineered encoder</text>
  <text class="t s" x="372.0" y="174" text-anchor="middle">event-gated inputs to</text>
  <text class="t s" x="372.0" y="193" text-anchor="middle">named model populations</text>
  <text class="t m" x="372.0" y="222" text-anchor="middle">software proxies, not transduction</text>
  <rect x="510" y="118" width="204" height="124" rx="12" fill="url(#box)" stroke="#334155" stroke-width="2"><animate attributeName="stroke" values="#334155;#334155;#f59e0b;#f59e0b;#334155;#334155" keyTimes="0;0.1616;0.1766;0.2720;0.3020;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <text class="t h" x="612.0" y="148" text-anchor="middle">MaleCNS dynamics</text>
  <text class="t s" x="612.0" y="174" text-anchor="middle">166,700 neurons</text>
  <text class="t s" x="612.0" y="193" text-anchor="middle">25,582,938 directed edges</text>
  <text class="t m" x="612.0" y="222" text-anchor="middle">leaky-rate state, declared signs</text>
  <rect x="750" y="118" width="204" height="124" rx="12" fill="url(#box)" stroke="#334155" stroke-width="2"><animate attributeName="stroke" values="#334155;#334155;#f59e0b;#f59e0b;#334155;#334155" keyTimes="0;0.2738;0.2888;0.3841;0.4141;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <text class="t h" x="852.0" y="148" text-anchor="middle">Labeled readouts</text>
  <text class="t s" x="852.0" y="174" text-anchor="middle">TTMn · DNa01 · MN9</text>
  <text class="t s" x="852.0" y="193" text-anchor="middle">antennal motor pools</text>
  <text class="t m" x="852.0" y="222" text-anchor="middle">source-aware program selection</text>
  <rect x="990" y="118" width="204" height="124" rx="12" fill="url(#box)" stroke="#334155" stroke-width="2"><animate attributeName="stroke" values="#334155;#334155;#f59e0b;#f59e0b;#334155;#334155" keyTimes="0;0.3859;0.4009;0.4963;0.5263;1" dur="10.0s" repeatCount="indefinite"/></rect>
  <text class="t h" x="1092.0" y="148" text-anchor="middle">Scripted body program</text>
  <text class="t s" x="1092.0" y="174" text-anchor="middle">HOVER · CRUISE · GROOM</text>
  <text class="t s" x="1092.0" y="193" text-anchor="middle">FEED · ESCAPE_JUMP · FLEE …</text>
  <text class="t m" x="1092.0" y="222" text-anchor="middle">bounded thrust and torque</text>
  <text class="t ev" x="132.0" y="106" text-anchor="middle" opacity="0">PLAYER APPROACH<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0120;0.1547;0.1667;1" dur="10.0s" repeatCount="indefinite"/></text>
  <text class="t ev" x="132.0" y="106" text-anchor="middle" opacity="0">BRUSH<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1787;0.3213;0.3333;1" dur="10.0s" repeatCount="indefinite"/></text>
  <text class="t ev" x="132.0" y="106" text-anchor="middle" opacity="0">ATTACK ATTEMPT<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3453;0.4880;0.5000;1" dur="10.0s" repeatCount="indefinite"/></text>
  <text class="t ev" x="132.0" y="106" text-anchor="middle" opacity="0">FOOD<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5120;0.6547;0.6667;1" dur="10.0s" repeatCount="indefinite"/></text>
  <text class="t ev" x="132.0" y="106" text-anchor="middle" opacity="0">LIGHT CHANGE<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6787;0.8213;0.8333;1" dur="10.0s" repeatCount="indefinite"/></text>
  <text class="t ev" x="132.0" y="106" text-anchor="middle" opacity="0">NEARBY MOB<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8333;0.8453;0.9880;1" dur="10.0s" repeatCount="indefinite"/></text>
</svg>
